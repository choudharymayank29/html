        <center>
            <section style="max-width:800px; overflow:hidden;">
                <img class="mySlides" src="image1.jpg" style="height:400px; width:100%; display:none;">
                <img class="mySlides" src="image2.jpg" style="height:400px; width:100%; display:none;">
                <img class="mySlides" src="image3.jpg" style="height:400px; width:100%; display:none;">
            </section>
        </center>
    </section>

    <script>
        var myIndex = 0;
        carousel();

        function carousel() {
            var i;
            var x = document.getElementsByClassName("mySlides");
            for (i = 0; i < x.length; i++) {
                x[i].style.display = "none";
            }
            myIndex++;
            if (myIndex > x.length) {myIndex = 1}
            x[myIndex-1].style.display = "block";
            setTimeout(carousel, 3000); // Changes image every 3 seconds
        }
    </script>

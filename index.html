    <section class="section section-dark">
        <h2>Our Delicious Menu Sliders</h2>
        <p>Take a look at our special dishes below. The slider will automatically change images every 3 seconds!</p>
    </section>

    <center>
        <section style="max-width:1340px; overflow:hidden;">
            <img class="mySlides" src="image1.jpg" style="height:500px; width:1340px; display:none;">
            <img class="mySlides" src="image2.jpg" style="height:500px; width:1340px; display:none;">
            <img class="mySlides" src="image3.jpg" style="height:500px; width:1340px; display:none;">
            <img class="mySlides" src="image4.jpg" style="height:500px; width:1340px; display:none;">
            <img class="mySlides" src="image5.jpg" style="height:500px; width:1340px; display:none;">
        </section>
    </center>

    <script>
        var myIndex = 0;
        carousel();

        function carousel() {
            var i;
            var x = document.getElementsByClassName("mySlides");
            for (i = 0; i < x.length; i++) {
                x[i].style.display = "none";  // सारी इमेजेस को छुपाता है
            }
            myIndex++;
            if (myIndex > x.length) { myIndex = 1 }
            x[myIndex - 1].style.display = "block";  // सिर्फ एक इमेज को दिखाता है
            setTimeout(carousel, 3000);  // हर 3 सेकंड में इमेज बदलेगी
        }
    </script>
